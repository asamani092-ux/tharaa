name: Deploy Frontend to Hostinger

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20' # ترقية الإصدار ليتوافق مع التقنيات الحديثة

    - name: 🛠️ Install pnpm
      uses: pnpm/action-setup@v4 # استخدام أحدث إصدار من الأداة
      with:
        version: 9 # إجبار النظام على استخدام إصدار 9 لدعم الـ Catalogs

    - name: 📥 Install Dependencies (Frontend Only)
      # سنقوم بتثبيت حزم الواجهة فقط وتجاهل الـ api-server
      run: pnpm install --filter "./artifacts/tharaa..."

    - name: 🏗️ Build Frontend
      # بناء مشروع الثراء فقط
      run: pnpm --filter "./artifacts/tharaa" build

    - name: 🚀 Sync files to Hostinger
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./artifacts/tharaa/dist/ 
        server-dir: ./public_html/
