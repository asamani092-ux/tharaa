name: Deploy Frontend to Hostinger

on:
  push:
    branches:
      - main # تأكد أن هذا هو اسم الفرع الرئيسي لديك

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: 🛠️ Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8

    - name: 📥 Install Dependencies (Root)
      # التثبيت يجب أن يكون في المجلد الرئيسي للمشروع
      run: pnpm install

    - name: 🏗️ Build Frontend
      # سنقوم بالدخول لمجلد الواجهة وبنائه
      run: |
        cd artifacts/tharaa
        pnpm run build

    - name: 🚀 Sync files to Hostinger
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # المسار الناتج من عملية البناء
        local-dir: ./artifacts/tharaa/dist/ 
        server-dir: ./public_html/
