name: Deploy Frontend to Hostinger

on:
  push:
    branches:
      - main # تأكد أن هذا هو اسم الفرع الرئيسي عندك

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: 🛠️ Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8

    - name: 📥 Install Dependencies
      # قمنا بإضافة المسار الصحيح هنا
      run: pnpm install
      working-directory: ./artifacts/thraa

    - name: 🏗️ Build Project
      # قمنا بإضافة المسار الصحيح هنا أيضاً
      run: pnpm run build
      working-directory: ./artifacts/thraa

    - name: 🚀 Sync files to Hostinger
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # المسار الذي ستخرج فيه ملفات الـ Build النهائية
        local-dir: ./artifacts/thraa/dist/ 
        server-dir: ./public_html/
