name: Deploy Frontend to Hostinger

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: 🛠️ Install pnpm
      uses: pnpm/action-setup@v4

    - name: 📥 Install All Dependencies
      # سنقوم بتثبيت كل الحزم لضمان عمل الروابط بين المجلدات (Workspace Linking)
      run: pnpm install --no-frozen-lockfile

    - name: 🏗️ Build Frontend
      # تزويد النظام بكل المتغيرات التي يطلبها مع تجاهل تحذيرات التنسيق
      env:
        PORT: 3000
        BASE_PATH: /
        NODE_ENV: production
        CI: false # لمنع توقف البناء بسبب تحذيرات بسيطة (Warnings)
      run: pnpm --filter "./artifacts/tharaa" build

    - name: 🚀 Sync files to Hostinger
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21 # المنفذ الافتراضي لـ Hostinger
        local-dir: ./artifacts/tharaa/dist/ 
        server-dir: ./public_html/
        dangerous-clean-slate: false
