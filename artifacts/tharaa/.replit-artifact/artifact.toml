kind = "web"
previewPath = "/"
title = "ثراء المعرفة"
version = "1.0.0"
id = "artifacts/tharaa"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20970

[services.development]
run = "pnpm --filter @workspace/tharaa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tharaa", "run", "build" ]
publicDir = "artifacts/tharaa/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20970"
BASE_PATH = "/"
